[package]
name = "owlet-dashboard-desktop"
version = "0.1.0"
description = "Unofficial Owlet sock history dashboard - desktop shell"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
# Remembers where the widget (and main window) were left.
tauri-plugin-window-state = "2"
# Closing hides to the tray, so a second launch must surface the first copy
# instead of starting another tray icon, widget and alarm thread.
tauri-plugin-single-instance = "2"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# SetCurrentProcessExplicitAppUserModelID: without it, Windows drops our toasts
# because the process AUMID doesn't match the installer's shortcut AUMID.
# Win32_Media_Audio(+Endpoints), System_Com*, Variant, PropertiesSystem,
# FunctionDiscovery: WASAPI red alarm, endpoint volume and device names;
# PlaySoundW remains as the fallback.
windows = { version = "0.61", features = [
    "Win32_UI_Shell",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_FunctionDiscovery",
] }
# We call this crate directly instead of tauri-plugin-notification: the plugin
# routes through notify-rust, whose show() registers activation handlers on a
# spawned task and swallows the error, and the toast never actually appears.
tauri-winrt-notification = "0.7"

[profile.release]
strip = true
lto = true
